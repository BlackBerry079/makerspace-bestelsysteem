<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makerspace - Registreren</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #b91c1c;
      --focus-ring: rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 45%, #f3f4f6 100%);
      min-height: 100vh;
    }

    .site-header {
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(6px);
    }

    .navbar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-link {
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .nav-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--primary-hover);
    }

    .auth-page {
      width: 100%;
      max-width: 420px;
      margin: 56px auto 24px;
      padding: 0 18px;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      padding: 28px 24px;
      animation: fadeInUp 0.35s ease;
    }

    .auth-title {
      margin: 0 0 22px;
      font-size: 1.6rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 13px;
      font: inherit;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    .form-input-invalid {
      border-color: var(--danger);
    }

    .error-message {
      margin: 4px 0 0;
      color: var(--danger);
      font-size: 0.88rem;
      min-height: 18px;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 8px;
      background-color: var(--primary);
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .primary-button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      .auth-page {
        margin-top: 34px;
      }

      .auth-card {
        border-radius: 14px;
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand-link" href="/">Makerspace</a>
      <a class="nav-link" href="login.html">Inloggen</a>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <h1 class="auth-title">Registreren</h1>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Naam</label>
          <input class="form-input" type="text" id="name" name="name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">E-mailadres</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Wachtwoord</label>
          <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Bevestig wachtwoord</label>
          <input class="form-input" type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
        </div>

        <p id="register-error" class="error-message" aria-live="polite"></p>
        <button class="primary-button" type="submit">Registreren</button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var registerForm = document.getElementById("register-form");
      var nameInput = document.getElementById("name");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var confirmPasswordInput = document.getElementById("confirm-password");
      var errorMessage = document.getElementById("register-error");

      if (
        !registerForm ||
        !nameInput ||
        !emailInput ||
        !passwordInput ||
        !confirmPasswordInput ||
        !errorMessage
      ) {
        return;
      }

      function setInvalidState(input, isInvalid) {
        input.classList.toggle("form-input-invalid", isInvalid);
      }

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      registerForm.addEventListener("submit", function (event) {
        event.preventDefault();

        var nameValue = nameInput.value.trim();
        var emailValue = emailInput.value.trim();
        var passwordValue = passwordInput.value.trim();
        var confirmPasswordValue = confirmPasswordInput.value.trim();

        setInvalidState(nameInput, false);
        setInvalidState(emailInput, false);
        setInvalidState(passwordInput, false);
        setInvalidState(confirmPasswordInput, false);
        errorMessage.textContent = "";

        if (!nameValue || !emailValue || !passwordValue || !confirmPasswordValue) {
          errorMessage.textContent = "Vul alle verplichte velden in.";
          setInvalidState(nameInput, !nameValue);
          setInvalidState(emailInput, !emailValue);
          setInvalidState(passwordInput, !passwordValue);
          setInvalidState(confirmPasswordInput, !confirmPasswordValue);
          return;
        }

        if (!isValidEmail(emailValue)) {
          errorMessage.textContent = "Voer een geldig e-mailadres in.";
          setInvalidState(emailInput, true);
          return;
        }

        if (passwordValue !== confirmPasswordValue) {
          errorMessage.textContent = "Wachtwoorden komen niet overeen.";
          setInvalidState(passwordInput, true);
          setInvalidState(confirmPasswordInput, true);
          return;
        }

        alert("Registratie gelukt (demo).");
      });
    })();
  </script>
</body>
</html>
